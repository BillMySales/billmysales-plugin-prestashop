name: End-to-end tests

# The module in the PrestaShop Docker stack, orders through the checkout,
# deliveries to a local receiver (tests/e2e/run.sh). Also called by
# release.yml (workflow_call), which releases only when it passes.
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  e2e:
    name: PrestaShop ${{ matrix.prestashop }}, PHP ${{ matrix.php }}
    timeout-minutes: 25
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The combinations the Docker stack validates (its README, "Supported
        # versions"): the versions the module supports are these, from the
        # lowest to the latest.
        include:
          - prestashop: '8.2.8'
            php: '7.4'
          - prestashop: '8.2.8'
            php: '8.1'
          - prestashop: '9.1.5-5.0'
            php: '8.1'
          - prestashop: '9.1.5-5.0'
            php: '8.5'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Only Docker is needed: every tool runs in a container. The empty
      # PS_SHA256 skips the check of a version other than the stack's default.
      - name: Run the end-to-end tests
        run: make e2e
        env:
          E2E_STACK_ENV: |
            PS_VERSION=${{ matrix.prestashop }}
            PS_SHA256=
            PHP_VERSION=${{ matrix.php }}

      - name: Upload the deliveries received
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-ps${{ matrix.prestashop }}-php${{ matrix.php }}
          path: var/e2e
          if-no-files-found: ignore
